spring:
  application:
    name: CMS-premium
  config:
    # Local development: read .env from the working directory so the app can be started
    # straight from the IDE. Real environment variables outrank it, so a container that
    # passes them in is unaffected, and the missing file is not an error in production.
    import: optional:file:./.env[.properties]
  jpa:
    hibernate:
      # 'update' is what applies the new blog_post.source_topic column; there is no
      # migration tool in this project yet.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASSWORD}
  task:
    scheduling:
      pool:
        # More than one thread so a slow generation run cannot stall other scheduled tasks.
        size: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  upload-dir: ${APP_UPLOAD_DIR}
  cookie:
    # Set to false only for local plain-HTTP development.
    secure: ${APP_COOKIE_SECURE:true}
  # Used to link to a published post from the Telegram confirmation message.
  site-base-url: ${SITE_BASE_URL:}

yandex:
  gpt:
    api-key: ${YANDEX_GPT_API_KEY}
    folder-id: ${YANDEX_GPT_FOLDER_ID}
    model: ${YANDEX_GPT_MODEL:yandexgpt/latest}
    # A 600-900 word HTML article wrapped in JSON does not fit into 2000 tokens.
    max-tokens: ${YANDEX_GPT_MAX_TOKENS:8000}
    temperature: ${YANDEX_GPT_TEMPERATURE:0.6}
    connect-timeout-seconds: ${YANDEX_GPT_CONNECT_TIMEOUT:10}
    read-timeout-seconds: ${YANDEX_GPT_READ_TIMEOUT:180}

content:
  generation:
    enabled: ${CONTENT_GENERATION_ENABLED:true}
    cron: ${CONTENT_GENERATION_CRON:0 0 8 * * *}
    # Whole days between posts: 1 daily, 3 every third day, 7 weekly. Deliberately not a
    # cron field - a step of 3 in day-of-month collapses the gap at every month boundary.
    interval-days: ${CONTENT_GENERATION_INTERVAL_DAYS:1}

telegram:
  # An empty token or chat id switches the bot off entirely: the app still boots and still
  # generates, posts just stay drafts. Needed for local development and CI.
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:}
  poll-timeout-seconds: ${TELEGRAM_POLL_TIMEOUT:30}
  # Must stay above poll-timeout-seconds or every idle long poll fails on read.
  read-timeout-seconds: ${TELEGRAM_READ_TIMEOUT:40}
  connect-timeout-seconds: ${TELEGRAM_CONNECT_TIMEOUT:10}
  max-revisions: ${TELEGRAM_MAX_REVISIONS:5}

jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}
